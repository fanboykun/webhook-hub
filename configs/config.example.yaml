server:
  address: ":4001"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 20s
  max_webhook_body_bytes: 1048576
  trusted_proxies: []

api:
  # Local config.yaml is secret-bearing and ignored by Git. Replace this value.
  admin_token: replace-with-output-of-make-gen-token
  docs_enabled: true

logging:
  level: info
  format: json
  add_source: false

database:
  path: ./data/gateway.db
  # Replace this with the 64-character hex output of make gen-encryption-key.
  encryption_key: replace-with-output-of-make-gen-encryption-key
  busy_timeout: 5s
  max_open_connections: 1
  retain_raw_payloads: true

workers:
  poll_interval: 1s
  batch_size: 50
  concurrency: 1
  lease_duration: 2m
  recovery_interval: 30s

retry:
  max_attempts: 8
  base_delay: 2s
  max_delay: 15m
  jitter: 0.20

integrations:
  watcher-production:
    source: watcher
    secret: whsec_replace-me
    replay_window: 5m

  github-main:
    source: github
    secret: replace-with-github-webhook-secret

destinations:
  slack-deployments:
    type: slack
    webhook_url: https://example.invalid/replace-with-slack-webhook
    renderer_profiles:
      - watcher-deployment-failed-detailed
      - github-workflow-failed-detailed

  telegram-bot:
    type: telegram
    bot_token: replace-with-telegram-bot-token
    chat_id: "-100123456789"
    renderer_profiles:
      - watcher-deployment-failed-compact
      - github-workflow-failed-compact

  teams-oncall:
    type: teams
    webhook_url: https://example.invalid/replace-with-teams-webhook
    renderer_profiles:
      - watcher-deployment-failed-detailed
      - github-workflow-failed-detailed

renderer_profiles:
  watcher-deployment-failed-detailed:
    source: watcher
    key: watcher.deployment.failed
    templates:
      slack:
        title: "[{{.Severity}}] {{.Title}}"
        body: "*Service:* {{.Payload.service.name}}\n*Environment:* {{.Environment}}\n*Release:* {{.Payload.attempt.target_version}}\n*Summary:* {{.Summary}}"
      telegram:
        text: "<b>[{{.Severity}}] {{.Title}}</b>\nService: <code>{{.Payload.service.name}}</code>\nEnvironment: <b>{{.Environment}}</b>\nRelease: <code>{{.Payload.attempt.target_version}}</code>\nSummary: <i>{{.Summary}}</i>"
      teams:
        title: "[{{.Severity}}] {{.Title}}"
        body: "**Service:** {{.Payload.service.name}}\n\n**Environment:** {{.Environment}}\n\n**Release:** {{.Payload.attempt.target_version}}\n\n{{.Summary}}"

  github-workflow-failed-detailed:
    source: github
    key: github.workflow.failed
    templates:
      slack:
        title: "[{{.Severity}}] {{.Title}}"
        body: "*Actor:* {{.Payload.sender.login}}\n*Workflow:* {{.Payload.workflow_run.name}}\n*Summary:* {{.Summary}}\n*URL:* {{.Payload.workflow_run.html_url}}"
      telegram:
        text: "<b>[{{.Severity}}] {{.Title}}</b>\nActor: <code>{{.Payload.sender.login}}</code>\nWorkflow: <code>{{.Payload.workflow_run.name}}</code>\nSummary: <i>{{.Summary}}</i>\n<a href=\"{{.Payload.workflow_run.html_url}}\">Open event</a>"
      teams:
        title: "[{{.Severity}}] {{.Title}}"
        body: "**Actor:** {{.Payload.sender.login}}\n\n**Workflow:** {{.Payload.workflow_run.name}}\n\n{{.Summary}}\n\n[Open event]({{.Payload.workflow_run.html_url}})"

  watcher-deployment-failed-compact:
    source: watcher
    key: watcher.deployment.failed
    templates:
      telegram:
        text: "<b>{{.Title}}</b>\n{{.Summary}}"

  github-workflow-failed-compact:
    source: github
    key: github.workflow.failed
    templates:
      telegram:
        text: "<b>{{.Title}}</b>\n{{.Summary}}"

routes:
  - id: watcher-deployment-failed
    description: Send failed Watcher deployments to configured channels
    match:
      sources: [watcher]
      types: [watcher.deployment.failed]
    destinations:
      - slack-deployments
      - telegram-bot
      - teams-oncall

  - id: github-workflow-failed
    description: Send failed GitHub workflows to configured channels
    match:
      sources: [github]
      types: [github.workflow.failed]
    destinations:
      - slack-deployments
      - telegram-bot
      - teams-oncall
